<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048 パズル</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <p class="hint">スワイプでタイルを動かして、2048を目指そう！</p>
      <button class="btn" id="new-game-btn">新しいゲーム</button>
    </div>

    <div class="board-wrap">
      <div class="board" id="board">
        <div class="grid-bg" id="grid-bg"></div>
        <div class="tiles" id="tiles"></div>
      </div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay-message" id="overlay-message"></div>
        <button class="btn" id="overlay-btn">もう一度</button>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
